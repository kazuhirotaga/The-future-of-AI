<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お絵かきキャンバス</title>
<style>
  :root {
    --bg: #f4f1ea;
    --panel: #ffffff;
    --ink: #2b2b2b;
    --muted: #6b6b6b;
    --accent: #c8553d;
    --border: #ddd6c8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1b19; --panel: #262522; --ink: #ece8df; --muted: #a39e93;
      --accent: #e07a5f; --border: #3a3833;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 16px; gap: 12px;
  }
  h1 { font-size: 1.2rem; margin: 0; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px; max-width: 800px; width: 100%;
  }
  .toolbar label { font-size: .85rem; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  button {
    font: inherit; font-size: .85rem; padding: 6px 12px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--ink); cursor: pointer;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  select { font: inherit; font-size: .85rem; padding: 5px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--ink); }
  button[aria-pressed="true"] { outline: 2px solid var(--accent); }
  canvas {
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    max-width: 100%; max-height: 85vh; width: auto; height: auto;
    touch-action: none; cursor: crosshair;
  }
  .note { font-size: .8rem; color: var(--muted); max-width: 800px; text-align: center; }
</style>
</head>
<body>
  <h1>お絵かきキャンバス</h1>
  <div class="toolbar">
    <label>色 <input type="color" id="color" value="#2b2b2b"></label>
    <label>太さ <input type="range" id="width" min="1" max="40" value="4"></label>
    <button id="eraser" aria-pressed="false">消しゴム</button>
    <button id="undo">元に戻す</button>
    <button id="clear">全消去</button>
    <button id="save">PNG保存</button>
    <select id="pick" aria-label="AIが描く絵"></select>
    <button id="ai" class="primary">AIが描く</button>
  </div>
  <canvas id="canvas" width="800" height="560"></canvas>
  <p class="note">マウスや指で自由に描けます。「AIが描く」を押すと、選んだ絵を Claude が一筆ずつ、同じペンで描いていきます。</p>

<script src="draw-kit.js"></script>
<script src="ai-drawing.js"></script>
<script src="moonlight-copy.js"></script>
<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const colorEl = document.getElementById('color');
  const widthEl = document.getElementById('width');
  const eraserEl = document.getElementById('eraser');

  // Every stroke (human or AI) is kept so undo can replay the history.
  const strokes = [];
  let current = null;
  let erasing = false;
  let animating = false;

  function drawStroke(s, upto = s.points.length) {
    const pts = s.points.slice(0, upto);
    if (!pts.length) return;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.globalAlpha = s.alpha ?? 1;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    if (s.fill && upto === s.points.length) {
      ctx.closePath();
      ctx.fillStyle = s.fill;
      ctx.fill();
    }
    if (s.width > 0) {
      ctx.strokeStyle = s.color;
      ctx.lineWidth = s.width;
      if (pts.length === 1) ctx.lineTo(pts[0][0] + 0.01, pts[0][1]);
      ctx.stroke();
    }
    ctx.restore();
  }

  function redraw() {
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    strokes.forEach(s => drawStroke(s));
  }

  function pos(e) {
    const r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left) * canvas.width / r.width,
            (e.clientY - r.top) * canvas.height / r.height];
  }

  canvas.addEventListener('pointerdown', e => {
    if (animating) return;
    canvas.setPointerCapture(e.pointerId);
    current = {
      color: erasing ? '#fff' : colorEl.value,
      width: erasing ? +widthEl.value * 3 : +widthEl.value,
      points: [pos(e)],
    };
    strokes.push(current);
    drawStroke(current);
  });
  canvas.addEventListener('pointermove', e => {
    if (!current) return;
    current.points.push(pos(e));
    redraw();
  });
  const end = () => { current = null; };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);

  eraserEl.onclick = () => {
    erasing = !erasing;
    eraserEl.setAttribute('aria-pressed', erasing);
  };
  document.getElementById('undo').onclick = () => { if (!animating) { strokes.pop(); redraw(); } };
  document.getElementById('clear').onclick = () => { if (!animating) { strokes.length = 0; redraw(); } };
  document.getElementById('save').onclick = () => {
    const a = document.createElement('a');
    a.download = 'drawing.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  };

  const pick = document.getElementById('pick');
  window.AI_DRAWINGS.forEach(d => pick.add(new Option(d.title, d.id)));
  const find = id => window.AI_DRAWINGS.find(d => d.id === id) ?? window.AI_DRAWINGS[0];

  // Plays the AI's stroke list through the same pen, a few points per frame.
  function playAI(drawing, instant) {
    const list = drawing.strokes;
    canvas.width = drawing.width;
    canvas.height = drawing.height;
    strokes.length = 0;
    redraw();
    if (instant) { list.forEach(s => strokes.push(s)); redraw(); return Promise.resolve(); }
    animating = true;
    return new Promise(resolve => {
      let si = 0, pi = 0;
      function step() {
        if (si >= list.length) { animating = false; return resolve(); }
        const s = list[si];
        pi = Math.min(pi + Math.max(2, Math.ceil(s.points.length / 25)), s.points.length);
        redraw();
        drawStroke(s, pi);
        if (pi >= s.points.length) { strokes.push(s); si++; pi = 0; }
        requestAnimationFrame(step);
      }
      step();
    });
  }
  document.getElementById('ai').onclick = () => { if (!animating) playAI(find(pick.value)); };

  redraw();
  // ?ai=<id> draws that picture on load; adding &instant skips the animation (used for screenshots).
  const params = new URLSearchParams(location.search);
  if (params.has('ai')) {
    const d = find(params.get('ai'));
    pick.value = d.id;
    playAI(d, params.has('instant'));
  }
})();
</script>
</body>
</html>
